[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma3-pallas"
version = "0.1.0"
description = "Pallas TPU kernels at Gemma 3 1B's shapes"
requires-python = ">=3.12"
dependencies = ["jax>=0.11.0", "numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
